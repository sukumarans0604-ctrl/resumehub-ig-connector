name: Post scheduled Instagram content
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: instagram-poster
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Wake the media host (free hosts sleep when idle)
        run: curl -s -m 90 "${{ vars.PUBLIC_BASE_URL }}/" > /dev/null || true
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          MEDIA_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}/media
        run: npm run post
      - name: Save the updated schedule
        if: always()
        run: |
          git config user.name "resumehub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/queue.json
          git diff --cached --quiet || (git commit -m "Update posting queue" && git push)

name: Refresh Instagram token
on:
  schedule:
    - cron: "0 3 1,15 * *"   # 1st and 15th of each month
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Refresh and store the token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          NEW_TOKEN=$(node scripts/refresh-token.js | sed -n 's/^NEW_TOKEN=//p')
          echo "::add-mask::$NEW_TOKEN"
          gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "$GITHUB_REPOSITORY"

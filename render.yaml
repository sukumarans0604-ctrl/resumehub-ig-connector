services:
  - type: web
    name: resumehub-ig-connector
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: CONNECTOR_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
